<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Meu Player Drive</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --purple: #7c3aed;
      --pink: #ec4899;
      --cyan: #06b6d4;
      --bg: #0d0415;
      --surface: #1b0d2b;
      --border: rgba(255, 255, 255, 0.14);
    }
    body {
      background: radial-gradient(circle at top, #1a0530 0%, var(--bg) 72%);
      color: #fff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 14px 44px;
    }
    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    header {
      text-align: center;
      padding: 6px 0;
    }
    header h1 {
      font-size: 1.45rem;
      font-weight: 800;
      background: linear-gradient(90deg, #fff, var(--cyan), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header p {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.65);
      margin-top: 4px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }
    .now-playing {
      text-align: center;
      border-color: rgba(124, 58, 237, 0.55);
      background: linear-gradient(145deg, rgba(124,58,237,0.25), rgba(236,72,153,0.14));
    }
    .badge {
      display: inline-block;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--cyan);
      font-weight: 700;
      margin-bottom: 6px;
    }
    #track-title {
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 3px;
      word-break: break-word;
    }
    #track-artist {
      font-size: 0.84rem;
      color: var(--pink);
      margin-bottom: 14px;
    }
    .drive-box {
      width: 100%;
      background: #141414;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 14px;
      display: none;
    }
    .drive-box.open {
      display: block;
    }
    #drive-iframe {
      width: 100%;
      height: 76px;
      border: 0;
      display: block;
      background: #141414;
    }
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }
    .ctrl-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      color: #fff;
      font-size: 1.15rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 18px rgba(236, 72, 153, 0.32);
    }
    .ctrl-btn:active { transform: scale(0.94); }
    .search-input {
      width: 100%;
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.88rem;
      outline: none;
      margin-bottom: 10px;
    }
    .search-input:focus { border-color: var(--cyan); }
    .playlist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.7);
      font-weight: 700;
      gap: 8px;
    }
    .btn-share {
      background: rgba(6, 182, 212, 0.2);
      border: 1px solid rgba(6, 182, 212, 0.5);
      color: var(--cyan);
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
    }
    #playlist {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 380px;
      overflow-y: auto;
    }
    .track-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid transparent;
      border-radius: 10px;
      cursor: pointer;
    }
    .track-item.active {
      background: rgba(124, 58, 237, 0.28);
      border-color: var(--purple);
    }
    .track-meta { flex: 1; min-width: 0; }
    .track-meta strong {
      display: block;
      font-size: 0.92rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-meta span {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.62);
    }
    #toast {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: #1f1135;
      border: 1px solid var(--cyan);
      color: #fff;
      padding: 9px 16px;
      border-radius: 99px;
      font-size: 0.8rem;
      display: none;
      z-index: 99;
      max-width: 90vw;
      text-align: center;
    }
  </style>
</head>

  <div class="container">

      <div class="drive-box" id="drive-box">
        <iframe id="drive-iframe" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      </div>

      <div class="controls">
        <button class="ctrl-btn" onclick="prevTrack()" title="Anterior">⏮</button>
        <button class="ctrl-btn" onclick="nextTrack()" title="Próxima">⏭</button>
      </div>
    </section>

    <section class="card">
      <div class="playlist-header">
        <span>Playlist (<span id="count">0</span>)</span>

      <input type="search" class="search-input" id="search-box" placeholder="🔍 Buscar música pelo nome ou número..." oninput="renderPlaylist()" />
      <ul id="playlist"></ul>
    </section>
  </div>

", "url": "https://drive.google.com/file/d/1t4dinRHLscqkjnmP2IcBLr2uSOnyKgqt/view"}];

    const driveBox = document.getElementById('drive-box');
    const driveIframe = document.getElementById('drive-iframe');
    const statusBadge = document.getElementById('status-badge');

    let tracks = [];
    let currentIndex = -1;

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => { t.style.display = 'none'; }, 3000);
    }

    function extractDriveId(url) {
      if (!url) return null;
      const patterns = [
        /\/file\/d\/([a-zA-Z0-9_-]+)/,
        /[?&]id=([a-zA-Z0-9_-]+)/,
        /\/d\/([a-zA-Z0-9_-]+)/
      ];
      for (const p of patterns) {
        const m = url.match(p);
        if (m && m[1]) return m[1];
      }
      return null;
    }

    function getDrivePreviewUrl(rawUrl) {
      const clean = (rawUrl || '').trim();
      const id = extractDriveId(clean);
      if (id) {
        return `https://drive.google.com/file/d/${id}/preview`;
      }
      return clean;
    }

    function decodeSharedPlaylist(encoded) {
      const base64 = encoded.replace(/-/g, '+').replace(/_/g, '/');
      const padded = base64 + '='.repeat((4 - (base64.length % 4)) % 4);
      const binary = atob(padded);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      const jsonStr = new TextDecoder().decode(bytes);
      return JSON.parse(jsonStr);
    }

    function encodeSharedPlaylist(items) {
      const jsonStr = JSON.stringify(items);
      const bytes = new TextEncoder().encode(jsonStr);
      let binary = '';
      for (let i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function loadState() {
      try {
        const params = new URLSearchParams(window.location.search || '');
        const shared = params.get('p');
        if (shared) {
          const decoded = decodeSharedPlaylist(shared);
          if (Array.isArray(decoded) && decoded.length > 0) {
            tracks = decoded;
            showToast('Playlist compartilhada carregada!');
            return;
          }
        }
      } catch (e) {}
      tracks = DEFAULT_TRACKS.map(item => ({ ...item }));
    }

    function renderPlaylist() {
      const ul = document.getElementById('playlist');
      const query = (document.getElementById('search-box').value || '').trim().toLowerCase();
      document.getElementById('count').textContent = tracks.length;

      const filtered = tracks
        .map((t, idx) => ({ track: t, index: idx }))
        .filter(({ track }) => !query || track.title.toLowerCase().includes(query) || (track.artist || '').toLowerCase().includes(query));

      if (filtered.length === 0) {
        ul.innerHTML = '<li style="color:rgba(255,255,255,0.55);font-size:0.82rem;text-align:center;padding:12px;">Nenhuma música encontrada.</li>';
        return;
      }

      ul.innerHTML = filtered.map(({ track: t, index: i }) => `
        <li class="track-item ${i === currentIndex ? 'active' : ''}" onclick="playTrack(${i})">
          <div class="track-meta">
            <strong>${i === currentIndex ? '▶ ' : ''}${escapeHtml(t.title)}</strong>
            <span>${escapeHtml(t.artist || 'Google Drive')}</span>
          </div>
        </li>
      `).join('');
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function playTrack(idx) {
      if (idx < 0 || idx >= tracks.length) return;
      currentIndex = idx;
      const t = tracks[idx];
      document.getElementById('track-title').textContent = t.title;
      document.getElementById('track-artist').textContent = t.artist || 'Google Drive';
      statusBadge.textContent = 'Carregando no Drive';

      driveBox.classList.add('open');
      driveIframe.src = getDrivePreviewUrl(t.url);
      renderPlaylist();
    }

    function nextTrack() {
      if (tracks.length === 0) return;
      playTrack((currentIndex + 1) % tracks.length);
    }

    function prevTrack() {
      if (tracks.length === 0) return;
      playTrack((currentIndex - 1 + tracks.length) % tracks.length);
    }

    function copyShareLink() {
      if (tracks.length === 0) {
        showToast('Nenhuma música disponível para compartilhar.');
        return;
      }
      const encoded = encodeSharedPlaylist(tracks);
      const base = (window.location.href || SITE_URL).split('?')[0].split('#')[0] || SITE_URL;
      const url = `${base}?p=${encoded}`;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(() => {
          showToast('Link da playlist copiado!');
        }).catch(() => {
          window.prompt('Copie o link abaixo:', url);
        });
      } else {
        window.prompt('Copie o link abaixo:', url);
      }
    }

    loadState();
    document.getElementById('track-artist').textContent = `${tracks.length} músicas em ordem numérica`;
    renderPlaylist();
  </script>
