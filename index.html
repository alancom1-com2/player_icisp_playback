<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Player Louvor ICISP — Playback</title>
  <style>
    :root {
      --bg-app: #09090b;
      --bg-surface: #121216;
      --bg-card: #18181f;
      --bg-card-hover: #22222c;
      --border: #272732;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.25);
      --chord-yellow: #facc15;
      --nav-height: 64px;
      --mini-player-height: 76px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(9, 9, 11, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px 12px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .brand h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .brand span {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
    }

    .folder-pill {
      font-size: 11px;
      color: var(--text-muted);
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 999px;
      cursor: pointer;
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px 14px 10px 36px;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
      pointer-events: none;
    }

    /* Main List */
    main {
      flex: 1;
      padding: 12px 14px calc(var(--nav-height) + var(--mini-player-height) + 24px);
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
    }

    .section-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 10px;
      padding: 0 2px;
    }

    .track-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .track-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 11px 12px;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }

    .track-item:active {
      transform: scale(0.99);
    }

    .track-item.active {
      background: rgba(59, 130, 246, 0.12);
      border-color: var(--accent);
    }

    .track-num {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .track-item.active .track-num {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .track-info {
      flex: 1;
      min-width: 0;
    }

    .track-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-sub {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-letra {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 6px;
      background: rgba(250, 204, 21, 0.14);
      color: var(--chord-yellow);
      border: 1px solid rgba(250, 204, 21, 0.3);
    }

    .track-action-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 7px 10px;
      border-radius: 10px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }

    .track-action-btn:hover {
      border-color: var(--accent);
    }

    /* Placeholder Tabs */
    .placeholder-view {
      display: none;
      text-align: center;
      padding: 56px 20px;
      background: var(--bg-card);
      border: 1px dashed var(--border);
      border-radius: 16px;
      margin-top: 12px;
    }

    .placeholder-view h2 {
      font-size: 16px;
      margin-bottom: 6px;
    }

    .placeholder-view p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Mini Player */
    .mini-player {
      position: fixed;
      left: 0;
      right: 0;
      bottom: var(--nav-height);
      height: var(--mini-player-height);
      background: #14141a;
      border-top: 1px solid var(--border);
      padding: 8px 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      z-index: 30;
    }

    .progress-wrap {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .time-txt {
      font-size: 10px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      min-width: 30px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 4px;
      background: #2e2e3a;
      border-radius: 999px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
    }

    .mini-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .mini-meta {
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    .mini-title {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mini-hint {
      font-size: 11px;
      color: var(--chord-yellow);
    }

    .ctrl-btns {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 14px;
      cursor: pointer;
    }

    .icon-btn.play-main {
      background: var(--accent);
      border-color: var(--accent);
      width: 40px;
      height: 40px;
      font-size: 15px;
    }

    /* Bottom Navigation */
    nav.bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--nav-height);
      background: #0c0c10;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      z-index: 35;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
    }

    .nav-btn.active {
      color: var(--accent);
      font-weight: 700;
    }

    .nav-btn svg {
      width: 20px;
      height: 20px;
    }

    /* Full Lyrics & Chords Modal */
    .lyrics-modal {
      position: fixed;
      inset: 0;
      background: #050507;
      z-index: 50;
      display: none;
      flex-direction: column;
    }

    .lyrics-modal.open {
      display: flex;
    }

    .lyrics-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      background: #0e0e13;
      border-bottom: 1px solid var(--border);
    }

    .lyrics-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .lyrics-song-title {
      font-size: 14.5px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lyrics-song-sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Subtle Chords Toggle Button */
    .chords-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-muted);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .chords-toggle .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #52525b;
      transition: background 0.2s ease;
    }

    .chords-toggle.on {
      background: rgba(250, 204, 21, 0.12);
      border-color: rgba(250, 204, 21, 0.45);
      color: var(--chord-yellow);
    }
