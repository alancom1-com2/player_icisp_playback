<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Player ICISP • Letras e Repertório</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --purple: #7c3aed;
      --pink: #ec4899;
      --cyan: #06b6d4;
      --chord: #FFD700;
      --bg: #0d0415;
      --surface: #1b0d2b;
      --border: rgba(255, 255, 255, 0.14);
      --nav-bg: #11071c;
    }
    body {
      background: radial-gradient(circle at top, #1a0530 0%, var(--bg) 72%);
      color: #fff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 14px 86px;
    }
    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    header {
      text-align: center;
      padding: 4px 0;
    }
    header h1 {
      font-size: 1.38rem;
      font-weight: 800;
      background: linear-gradient(90deg, #fff, var(--cyan), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header p {
      font-size: 0.76rem;
      color: rgba(255,255,255,0.68);
      margin-top: 3px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 15px;
    }

    /* Tela de Letra (Fundo preto, letra branca, cifras e introduções em amarelo #FFD700) */
    .lyrics-stage {
      display: none;
      background: #070709;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 18px;
      padding: 14px 16px 18px;
      flex-direction: column;
      min-height: 55vh;
      max-height: 62vh;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
    }
    .lyrics-stage.active {
      display: flex;
    }
    .lyrics-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .icon-action {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #fff;
      border-radius: 999px;
      height: 32px;
      padding: 0 10px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .icon-action:active { transform: scale(0.95); }
    .chord-toggle {
      border-color: rgba(255, 215, 0, 0.28);
      color: rgba(255, 255, 255, 0.78);
    }
    .chord-toggle.on {
      background: rgba(255, 215, 0, 0.14);
      border-color: rgba(255, 215, 0, 0.65);
      color: var(--chord);
    }
    .lyrics-song-title {
      flex: 1;
      text-align: center;
      font-size: 0.96rem;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 2px;
    }
    .lyrics-category-tag {
      text-align: center;
      font-size: 0.74rem;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 8px;
      margin-bottom: 8px;
      letter-spacing: 0.04em;
    }
    .lyrics-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: auto;
      padding: 6px 4px 16px;
      color: #ffffff;
      font-size: 1.02rem;
      line-height: 1.55;
    }
    /* Modo Letra Pura (sem cifra): centralizado e fluido */
    .lyrics-scroll.mode-lyrics-only {
      text-align: center;
      white-space: pre-wrap;
    }
    .lyrics-scroll.mode-lyrics-only .line-lyric {
      margin-bottom: 3px;
    }
    .lyrics-scroll.mode-lyrics-only .line-empty {
      height: 12px;
    }
    /* Modo Cifra Ativa: alinhamento preciso de acordes sobre a letra */
    .lyrics-scroll.mode-chords {
      text-align: left;
      font-family: ui-monospace, 'Cascadia Mono', 'SFMono-Regular', Menlo, Consolas, monospace;
      font-size: 0.84rem;
      line-height: 1.38;
    }
    .line-intro {
      color: var(--chord);
      font-weight: 700;
      white-space: pre;
      margin-bottom: 6px;
      padding: 4px 6px;
      background: rgba(255, 215, 0, 0.07);
      border-left: 2px solid var(--chord);
      border-radius: 4px;
    }
    .line-chord {
      color: var(--chord);
      font-weight: 700;
      white-space: pre;
      margin-top: 5px;
    }
    .line-lyric {
      color: #ffffff;
    }
    .lyrics-scroll.mode-chords .line-lyric {
      white-space: pre;
    }
    .line-empty {
      height: 10px;
    }
    .lyrics-empty-hint {
      color: rgba(255, 255, 255, 0.68);
      font-size: 0.88rem;
      line-height: 1.5;
      margin-top: 18px;
      text-align: center;
    }
    .lyrics-editor {
      display: none;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }
    .lyrics-editor.open {
      display: flex;
    }
    .lyrics-textarea {
      width: 100%;
      min-height: 180px;
      background: #121218;
      border: 1px solid var(--cyan);
      border-radius: 12px;
      padding: 12px;
      color: #fff;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 0.86rem;
      line-height: 1.45;
      resize: vertical;
      outline: none;
    }
    .btn-gradient {
      background: linear-gradient(135deg, var(--purple), var(--pink));
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Player colorido (abaixa e compacta quando a letra abre) */
    .now-playing {
      text-align: center;
      border-color: rgba(124, 58, 237, 0.55);
      background: linear-gradient(145deg, rgba(124,58,237,0.28), rgba(236,72,153,0.16));
      transition: all 0.25s ease;
    }
    .now-playing.compact {
      padding: 11px 14px;
    }
    .now-playing.compact .badge,
    .now-playing.compact #track-artist {
      display: none;
    }
    .now-playing.compact #track-title {
      font-size: 0.95rem;
      margin-bottom: 6px;
    }
    .now-playing.compact .progress-wrap {
      margin-bottom: 10px;
    }
    .now-playing.compact .ctrl-btn {
      width: 42px;
      height: 42px;
      font-size: 0.95rem;
    }
    .now-playing.compact .ctrl-btn.play-main {
      width: 50px;
      height: 50px;
      font-size: 1.1rem;
    }

    .badge {
      display: inline-block;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--cyan);
      font-weight: 700;
      margin-bottom: 5px;
    }
    #track-title {
      font-size: 1.12rem;
      font-weight: 800;
      margin-bottom: 3px;
      word-break: break-word;
    }
    #track-artist {
      font-size: 0.82rem;
      color: var(--pink);
      margin-bottom: 12px;
    }
    .progress-wrap {
      margin-bottom: 14px;
    }
    .progress-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.72);
      margin-bottom: 5px;
    }
    #seek-bar {
      width: 100%;
      accent-color: var(--pink);
      cursor: pointer;
    }
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }
    .ctrl-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      color: #fff;
      font-size: 1.05rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 18px rgba(236, 72, 153, 0.32);
    }
    .ctrl-btn.play-main {
      width: 60px;
      height: 60px;
      font-size: 1.2rem;
    }
    .ctrl-btn:active { transform: scale(0.94); }

    /* Lista de Músicas */
    .playlist-card.hidden {
      display: none;
    }
    .search-input {
      width: 100%;
      background: rgba(0,0,0,0.42);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.88rem;
      outline: none;
      margin-bottom: 10px;
    }
    .search-input:focus { border-color: var(--cyan); }
    .playlist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.72);
      font-weight: 700;
      gap: 8px;
    }
    .btn-small {
      background: rgba(6, 182, 212, 0.18);
      border: 1px solid rgba(6, 182, 212, 0.45);
      color: var(--cyan);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
    }
    #playlist {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 360px;
      overflow-y: auto;
    }
    .track-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid transparent;
      border-radius: 10px;
      cursor: pointer;
    }
    .track-item.active {
      background: rgba(124, 58, 237, 0.28);
      border-color: var(--purple);
    }
    .track-meta { flex: 1; min-width: 0; }
    .track-meta strong {
      display: block;
      font-size: 0.92rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-meta span {
      font-size: 0.74rem;
      color: rgba(255,255,255,0.62);
    }
    .lyric-pill {
      font-size: 0.68rem;
      padding: 3px 8px;
      border-radius: 99px;
      background: rgba(6, 182, 212, 0.16);
      color: var(--cyan);
      border: 1px solid rgba(6, 182, 212, 0.35);
      white-space: nowrap;
    }
    .lyric-pill.has-chord {
      background: rgba(255, 215, 0, 0.12);
      color: var(--chord);
      border-color: rgba(255, 215, 0, 0.38);
    }

    /* Barra inferior de categorias/pastas */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(17, 7, 28, 0.96);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255, 255, 255, 0.14);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 6px 10px;
      z-index: 50;
    }
    .nav-item {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.62);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 10px;
    }
    .nav-item svg {
      width: 21px;
      height: 21px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }
    .nav-item.active {
      color: var(--cyan);
    }

    /* Modal para adicionar nova pasta/categoria ou música */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 80;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal-box {
      width: 100%;
      max-width: 440px;
      background: #190c28;
      border: 1px solid var(--purple);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .modal-box h3 {
      font-size: 1rem;
      color: #fff;
    }
    .modal-box p {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.7);
      line-height: 1.4;
    }
    .modal-input {
      width: 100%;
      background: rgba(0,0,0,0.45);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.86rem;
      outline: none;
    }
    #toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: #1f1135;
      border: 1px solid var(--cyan);
      color: #fff;
      padding: 8px 16px;
      border-radius: 99px;
      font-size: 0.78rem;
      display: none;
      z-index: 99;
      max-width: 90vw;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <header id="main-header">
      <h1>🎵 Player ICISP</h1>
      <p id="category-subtitle">Pasta: músicas • 50 faixas</p>
    </header>

    <!-- Tela de Letra (abre automaticamente ao clicar em uma música) -->
    <section class="lyrics-stage" id="lyrics-stage">
      <div class="lyrics-topbar">
        <button class="icon-action" onclick="closeLyricsView()" title="Voltar à lista">← Lista</button>
        <div class="lyrics-song-title" id="lyrics-title">Título da Música</div>
        <button class="icon-action chord-toggle on" id="btn-toggle-chords" onclick="toggleChordsMode()" title="Mostrar ou ocultar cifras em amarelo">Cifra: ON</button>
        <button class="icon-action" onclick="toggleLyricsEditor()" title="Editar letra ou cifra">•••</button>
      </div>
      <div class="lyrics-category-tag" id="lyrics-category-label">Hinos • ICISP</div>

      <div class="lyrics-scroll mode-chords" id="lyrics-display"></div>

      <div class="lyrics-editor" id="lyrics-editor">
        <textarea class="lyrics-textarea" id="lyrics-textarea" placeholder="Cole ou edite aqui a letra e as cifras desta música..."></textarea>
        <div style="display:flex;gap:8px;">
          <button class="btn-gradient" style="flex:1;" onclick="saveCurrentLyric()">Salvar Letra</button>
          <button class="icon-action" onclick="toggleLyricsEditor()">Cancelar</button>
        </div>
      </div>
    </section>

    <!-- Player Colorido (desce e fica compacto quando a letra está aberta) -->
    <section class="card now-playing" id="player-card">
      <div class="badge" id="status-badge">Pronto para tocar</div>
      <div id="track-title">Selecione uma música na lista</div>
      <div id="track-artist">Player próprio • GitHub</div>

      <div class="progress-wrap">
        <div class="progress-row">
          <span id="current-time">0:00</span>
          <span id="duration-time">0:00</span>
        </div>
        <input type="range" id="seek-bar" min="0" max="100" value="0" step="0.1" oninput="seekAudio(this.value)" />
      </div>

      <div class="controls">
        <button class="ctrl-btn" onclick="prevTrack()" title="Anterior">⏮</button>
        <button class="ctrl-btn play-main" id="btn-play" onclick="togglePlay()" title="Play / Pause">▶</button>
        <button class="ctrl-btn" onclick="nextTrack()" title="Próxima">⏭</button>
      </div>

      <audio id="audio-el" preload="metadata"></audio>
    </section>

    <!-- Lista de Músicas da Categoria Ativa -->
    <section class="card playlist-card" id="playlist-card">
      <div class="playlist-header">
        <span id="playlist-label">Músicas (<span id="count">0</span>)</span>
        <div style="display:flex;gap:6px;">
          <button class="btn-small" onclick="openAddTrackModal()">+ Faixa</button>
          <button class="btn-small" onclick="copyShareLink()">🔗 Link</button>
        </div>
      </div>
      <input type="search" class="search-input" id="search-box" placeholder="🔍 Buscar música pelo nome ou número..." oninput="renderPlaylist()" />
      <ul id="playlist"></ul>
    </section>
  </div>

  <!-- Barra de Navegação Inferior (Pastas / Categorias) -->
  <nav class="bottom-nav" id="bottom-nav"></nav>

  <!-- Modal para Nova Pasta ou Nova Música -->
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal-box" id="modal-content"></div>
  </div>

  <div id="toast"></div>

      more: '<svg viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>'
    };

    const audioEl = document.getElementById('audio-el');
    const statusBadge = document.getElementById('status-badge');
    const btnPlay = document.getElementById('btn-play');
    const seekBar = document.getElementById('seek-bar');
    const currentTimeEl = document.getElementById('current-time');
    const durationTimeEl = document.getElementById('duration-time');

    let categories = [];
    let activeCategoryId = 'musicas';
    let currentIndex = -1;
    let candidateUrls = [];
    let candidateIdx = 0;
    let showChords = true;

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => { t.style.display = 'none'; }, 3200);
    }

    function loadChordsPreference() {
      try {
        const pref = localStorage.getItem('icisp_show_chords_v1');
        if (pref === 'false') showChords = false;
      } catch (e) {}
      updateChordToggleButton();
    }

    function updateChordToggleButton() {
      const btn = document.getElementById('btn-toggle-chords');
      if (!btn) return;
      if (showChords) {
        btn.classList.add('on');
        btn.textContent = 'Cifra: ON';
      } else {
        btn.classList.remove('on');
        btn.textContent = 'Cifra: OFF';
      }
    }

    function toggleChordsMode() {
      showChords = !showChords;
      try {
        localStorage.setItem('icisp_show_chords_v1', String(showChords));
      } catch (e) {}
      updateChordToggleButton();
      const cat = getActiveCategory();
      if (currentIndex >= 0 && cat.tracks[currentIndex]) {
        renderLyricsContent(cat.tracks[currentIndex]);
      }
    }

    function syncEmbeddedLyrics(loadedCats) {
      const byFilename = {};
      const byNum = {};
      INITIAL_TRACKS.forEach(it => {
        byFilename[it.filename] = it;
        if (it.songNumber) byNum[it.songNumber] = it;
      });
      loadedCats.forEach(cat => {
        if (!Array.isArray(cat.tracks)) return;
        cat.tracks.forEach(tr => {
          const m = (tr.filename || '').match(/\(\s*(\d+)\s*\)/);
          const num = m ? parseInt(m[1], 10) : tr.songNumber;
          const ref = byFilename[tr.filename] || (num ? byNum[num] : null);
          if (ref) {
            if (!tr.lines || tr.lines.length === 0) {
              tr.lines = ref.lines;
            }
            if (!tr.lyrics || !tr.lyrics.trim()) {
              tr.lyrics = ref.lyrics;
            }
            if (!tr.songNumber && ref.songNumber) {
              tr.songNumber = ref.songNumber;
            }
          }
        });
      });
    }

    function loadSavedData() {
      try {
        const saved = localStorage.getItem('icisp_categories_v2') || localStorage.getItem('icisp_categories_v1');
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length > 0) {
            syncEmbeddedLyrics(parsed);
            categories = parsed;
            saveData();
            return;
          }
        }
      } catch (e) {}
      categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
    }

    function saveData() {
      try {
        localStorage.setItem('icisp_categories_v2', JSON.stringify(categories));
      } catch (e) {}
    }

    function getActiveCategory() {
      return categories.find(c => c.id === activeCategoryId) || categories[0];
    }

    function renderBottomNav() {
      const nav = document.getElementById('bottom-nav');
      const itemsHtml = categories.map(cat => `
        <button class="nav-item ${cat.id === activeCategoryId ? 'active' : ''}" onclick="selectCategory('${cat.id}')">
          ${ICONS[cat.icon] || ICONS.music}
          <span>${escapeHtml(cat.label)}</span>
        </button>
      `).join('');

      nav.innerHTML = itemsHtml + `
        <button class="nav-item" onclick="openAddCategoryModal()">
          ${ICONS.more}
          <span>Mais</span>
        </button>
      `;
    }

    function selectCategory(catId) {
      activeCategoryId = catId;
      currentIndex = -1;
      closeLyricsView();
      const cat = getActiveCategory();
      document.getElementById('category-subtitle').textContent = `Pasta: ${cat.folder} • ${cat.tracks.length} faixa(s)`;
      document.getElementById('playlist-label').innerHTML = `${escapeHtml(cat.label)} (<span id="count">${cat.tracks.length}</span>)`;
      renderBottomNav();
      renderPlaylist();
    }

    function buildCandidateUrls(track, folderName) {
      if (track.url) return [track.url];
      const enc = encodeURIComponent(track.filename);
      const nfcEnc = encodeURIComponent(track.filename.normalize('NFC'));
      const nfdEnc = encodeURIComponent(track.filename.normalize('NFD'));
      const f = folderName || 'músicas';
      const fallbackFolder = f === 'músicas' ? 'playback' : 'músicas';
      const list = [
        `./${encodeURIComponent(f)}/${enc}`,
        `./${encodeURIComponent(f.normalize('NFC'))}/${nfcEnc}`,
        `./${encodeURIComponent(f.normalize('NFD'))}/${nfdEnc}`,
        `./${encodeURIComponent(fallbackFolder)}/${enc}`,
        `./${enc}`
      ];
      return [...new Set(list)];
    }

    function formatTime(sec) {
      if (!isFinite(sec) || sec < 0) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function renderPlaylist() {
      const cat = getActiveCategory();
      const ul = document.getElementById('playlist');
      const query = (document.getElementById('search-box').value || '').trim().toLowerCase();
      const countEl = document.getElementById('count');
      if (countEl) countEl.textContent = cat.tracks.length;
      document.getElementById('category-subtitle').textContent = `Pasta: ${cat.folder} • ${cat.tracks.length} faixa(s)`;

      const filtered = cat.tracks
        .map((t, idx) => ({ track: t, index: idx }))
        .filter(({ track }) => !query || track.title.toLowerCase().includes(query) || (track.artist || '').toLowerCase().includes(query));

      if (filtered.length === 0) {
        ul.innerHTML = `<li style="color:rgba(255,255,255,0.6);font-size:0.82rem;text-align:center;padding:16px;line-height:1.45;">
          Nenhuma faixa cadastrada na pasta <strong>${escapeHtml(cat.folder)}</strong> ainda.<br/>
          Clique em <strong>+ Faixa</strong> acima para adicionar os MP3 desta pasta.
        </li>`;
        return;
      }

      ul.innerHTML = filtered.map(({ track: t, index: i }) => {
        const hasStructured = Array.isArray(t.lines) && t.lines.length > 0;
        const hasLyrics = hasStructured || (t.lyrics && t.lyrics.trim());
        const pillText = hasStructured ? 'Letra + Cifra' : (hasLyrics ? 'Letra ✓' : '+ Letra');
        const pillClass = hasStructured ? 'lyric-pill has-chord' : 'lyric-pill';
        return `
          <li class="track-item ${i === currentIndex ? 'active' : ''}" onclick="playTrack(${i}, true)">
            <div class="track-meta">
              <strong>${i === currentIndex ? '▶ ' : ''}${escapeHtml(t.title)}</strong>
              <span>${escapeHtml(t.artist || cat.label)}</span>
            </div>
            <span class="${pillClass}">${pillText}</span>
          </li>
        `;
      }).join('');
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function parseRawLinesToStructured(rawText) {
      const chordTokenRe = /^\(?[A-G](?:#|b)?(?:m|M|maj|min|dim|aug|sus|sua|add)?[0-9]*(?:\([0-9b#+,/-]+\))?(?:\/[0-9A-G#b]+)?\)?[°º+]?$/;
      const barRe = /^(?:II:?|:?II|I|\||%|2\/4|3\/4|4\/4|6\/8|\(?2ªX|>|FIM|Fim|Final|\(?\d+[xX]\)?)$/;
      return rawText.split(/\r?\n/).map(line => {
        const trimmed = line.trim();
        if (!trimmed) return { type: 'empty', text: '' };
        if (/\bIntro(?:d\.?)?\s*:?/i.test(trimmed)) return { type: 'intro', text: line.replace(/\s+$/, '') };
        const cleaned = trimmed.replace(/\(\s*(\d+[xX]|FIM|Fim|Final|acentos|direto|Piano|Solo)\s*\)/g, '');
        const tokens = cleaned.split(/\s+/).filter(Boolean);
        if (tokens.length > 0 && tokens.every(tok => {
          const cleanTok = tok.replace(/^[,.;]+|[,.;]+$/g, '');
          return chordTokenRe.test(cleanTok) || barRe.test(cleanTok) || /^\d+[xX]$/.test(cleanTok);
        })) {
          return { type: 'chord', text: line.replace(/\s+$/, '') };
        }
        return { type: 'lyric', text: trimmed };
      });
    }

    function renderLyricsContent(track) {
      const display = document.getElementById('lyrics-display');
      const hasStructured = Array.isArray(track.lines) && track.lines.length > 0;

      if (!hasStructured && (!track.lyrics || !track.lyrics.trim())) {
        display.className = 'lyrics-scroll mode-lyrics-only';
        display.innerHTML = `<div class="lyrics-empty-hint">
          Ainda não há letra salva para <strong>${escapeHtml(track.title)}</strong>.<br/><br/>
          Toque em <strong>•••</strong> no canto superior direito para colar a letra desta canção.
        </div>`;
        return;
      }

      const linesToRender = hasStructured ? track.lines : parseRawLinesToStructured(track.lyrics);

      if (showChords) {
        display.className = 'lyrics-scroll mode-chords';
        display.innerHTML = linesToRender.map(item => {
          if (item.type === 'empty') return '<div class="line-empty"></div>';
          if (item.type === 'intro') return `<div class="line-intro">${escapeHtml(item.text)}</div>`;
          if (item.type === 'chord') return `<div class="line-chord">${escapeHtml(item.text)}</div>`;
          return `<div class="line-lyric">${escapeHtml(item.text)}</div>`;
        }).join('');
      } else {
        display.className = 'lyrics-scroll mode-lyrics-only';
        const filtered = linesToRender.filter(item => item.type === 'lyric' || item.type === 'empty');
        // Remove consecutive empty divs when hiding chords
        const compacted = [];
        filtered.forEach(item => {
          if (item.type === 'empty' && (compacted.length === 0 || compacted[compacted.length - 1].type === 'empty')) return;
          compacted.push(item);
        });
        display.innerHTML = compacted.map(item => {
          if (item.type === 'empty') return '<div class="line-empty"></div>';
          return `<div class="line-lyric">${escapeHtml(item.text.trim())}</div>`;
        }).join('');
      }
      display.scrollTop = 0;
    }

    function openLyricsView(track, cat) {
      document.getElementById('lyrics-title').textContent = track.title;
      const numLabel = track.songNumber ? ` • Caderno #${track.songNumber}` : '';
      document.getElementById('lyrics-category-label').textContent = `${cat.label} • ICISP${numLabel}`;
      const display = document.getElementById('lyrics-display');
      const editor = document.getElementById('lyrics-editor');
      editor.classList.remove('open');
      display.style.display = 'block';

      renderLyricsContent(track);

      document.getElementById('lyrics-stage').classList.add('active');
      document.getElementById('playlist-card').classList.add('hidden');
      document.getElementById('main-header').style.display = 'none';
      document.getElementById('player-card').classList.add('compact');
    }

    function closeLyricsView() {
      document.getElementById('lyrics-stage').classList.remove('active');
      document.getElementById('playlist-card').classList.remove('hidden');
      document.getElementById('main-header').style.display = 'block';
      document.getElementById('player-card').classList.remove('compact');
    }

    function toggleLyricsEditor() {
      const cat = getActiveCategory();
      if (currentIndex < 0 || !cat.tracks[currentIndex]) return;
      const track = cat.tracks[currentIndex];
      const editor = document.getElementById('lyrics-editor');
      const display = document.getElementById('lyrics-display');
      const textarea = document.getElementById('lyrics-textarea');

      if (editor.classList.contains('open')) {
        editor.classList.remove('open');
        display.style.display = 'block';
      } else {
        if (Array.isArray(track.lines) && track.lines.length > 0) {
          textarea.value = track.lines.map(l => l.text).join('\n');
        } else {
          textarea.value = track.lyrics || '';
        }
        display.style.display = 'none';
        editor.classList.add('open');
        textarea.focus();
      }
    }

    function saveCurrentLyric() {
      const cat = getActiveCategory();
      if (currentIndex < 0 || !cat.tracks[currentIndex]) return;
      const text = document.getElementById('lyrics-textarea').value;
      const structured = parseRawLinesToStructured(text);
      cat.tracks[currentIndex].lines = structured;
      cat.tracks[currentIndex].lyrics = structured
        .filter(item => item.type === 'lyric' || item.type === 'empty')
        .map(item => item.text)
        .join('\n')
        .trim();
      saveData();
      openLyricsView(cat.tracks[currentIndex], cat);
      renderPlaylist();
      showToast('Letra e cifras salvas com sucesso!');
    }

    function tryCurrentCandidate(autoStart) {
      if (candidateIdx < candidateUrls.length) {
        audioEl.src = candidateUrls[candidateIdx];
        audioEl.load();
        if (autoStart) {
          audioEl.play().catch(() => {});
        }
      } else {
        btnPlay.textContent = '▶';
        statusBadge.textContent = 'Arquivo não encontrado na pasta';
        showToast('MP3 não encontrado na pasta selecionada do GitHub.');
      }
    }

    function playTrack(idx, autoStart = true) {
      const cat = getActiveCategory();
      if (idx < 0 || idx >= cat.tracks.length) return;
      currentIndex = idx;
      const t = cat.tracks[idx];
      document.getElementById('track-title').textContent = t.title;
      document.getElementById('track-artist').textContent = t.artist || cat.label;
      statusBadge.textContent = autoStart ? 'Tocando...' : 'Pronto para tocar';
      seekBar.value = 0;
      currentTimeEl.textContent = '0:00';
      durationTimeEl.textContent = '0:00';
      renderPlaylist();

      // Abre automaticamente a tela de letra ao clicar na música
      openLyricsView(t, cat);

      candidateUrls = buildCandidateUrls(t, cat.folder);
      candidateIdx = 0;
      tryCurrentCandidate(autoStart);
    }

    function togglePlay() {
      const cat = getActiveCategory();
      if (currentIndex < 0 && cat.tracks.length > 0) {
        playTrack(0, true);
        return;
      }
      if (audioEl.paused) {
        if (currentIndex >= 0 && cat.tracks[currentIndex]) {
          openLyricsView(cat.tracks[currentIndex], cat);
        }
        if (!audioEl.src) {
          tryCurrentCandidate(true);
        } else {
          audioEl.play().catch(() => {});
        }
      } else {
        audioEl.pause();
      }
    }

    function seekAudio(val) {
      if (!isFinite(audioEl.duration) || audioEl.duration <= 0) return;
      audioEl.currentTime = (val / 100) * audioEl.duration;
    }

    function nextTrack() {
      const cat = getActiveCategory();
      if (cat.tracks.length === 0) return;
      playTrack((currentIndex + 1) % cat.tracks.length, true);
    }

    function prevTrack() {
      const cat = getActiveCategory();
      if (cat.tracks.length === 0) return;
      playTrack((currentIndex - 1 + cat.tracks.length) % cat.tracks.length, true);
    }

    audioEl.addEventListener('play', () => {
      btnPlay.textContent = '⏸';
      statusBadge.textContent = 'Tocando';
    });

    audioEl.addEventListener('pause', () => {
      btnPlay.textContent = '▶';
      if (!statusBadge.textContent.includes('não encontrado')) {
        statusBadge.textContent = 'Pausado';
      }
    });

    audioEl.addEventListener('timeupdate', () => {
      if (isFinite(audioEl.duration) && audioEl.duration > 0) {
        seekBar.value = (audioEl.currentTime / audioEl.duration) * 100;
        currentTimeEl.textContent = formatTime(audioEl.currentTime);
        durationTimeEl.textContent = formatTime(audioEl.duration);
      }
    });

    audioEl.addEventListener('loadedmetadata', () => {
      if (isFinite(audioEl.duration) && audioEl.duration > 0) {
        durationTimeEl.textContent = formatTime(audioEl.duration);
      }
    });

    audioEl.addEventListener('ended', () => {
      nextTrack();
    });

    audioEl.addEventListener('error', () => {
      if (currentIndex < 0) return;
      candidateIdx++;
      tryCurrentCandidate(!audioEl.paused || statusBadge.textContent === 'Tocando...');
    });

    /* Modais para adicionar pastas/categorias e músicas */
    function closeModal() {
      document.getElementById('modal-backdrop').classList.remove('open');
    }

    function openAddCategoryModal() {
      const box = document.getElementById('modal-content');
      box.innerHTML = `
        <h3>Nova Pasta / Categoria na Barra</h3>
        <p>Crie um ícone novo na barra inferior apontando para a pasta que você criou no GitHub (ex.: <strong>playback</strong> ou <strong>louvores-externos</strong>).</p>
        <input type="text" class="modal-input" id="new-cat-label" placeholder="Nome no ícone (ex: Louvores Externos)" />
        <input type="text" class="modal-input" id="new-cat-folder" placeholder="Nome exato da pasta no GitHub (ex: louvores-externos)" />
        <div style="display:flex;gap:8px;margin-top:4px;">
          <button class="btn-gradient" style="flex:1;" onclick="confirmAddCategory()">Adicionar Ícone</button>
          <button class="icon-action" onclick="closeModal()">Fechar</button>
        </div>
      `;
      document.getElementById('modal-backdrop').classList.add('open');
    }

    function confirmAddCategory() {
      const label = (document.getElementById('new-cat-label').value || '').trim();
      const folder = (document.getElementById('new-cat-folder').value || '').trim().replace(/^\/+|\/+$/g, '');
      if (!label || !folder) {
        showToast('Preencha o nome do ícone e o nome da pasta no GitHub.');
        return;
      }
      const id = 'cat_' + Date.now();
      categories.push({
        id,
        label,
        folder,
        icon: 'music',
        tracks: []
      });
      saveData();
      closeModal();
      selectCategory(id);
      showToast(`Categoria "${label}" criada!`);
    }

    function openAddTrackModal() {
      const cat = getActiveCategory();
      const box = document.getElementById('modal-content');
      box.innerHTML = `
        <h3>Adicionar Faixas em "${escapeHtml(cat.label)}"</h3>
        <p>Cole os nomes exatos dos arquivos <strong>.mp3</strong> que você subiu na pasta <strong>${escapeHtml(cat.folder)}</strong> do GitHub (um por linha).</p>
        <textarea class="lyrics-textarea" style="min-height:130px;" id="bulk-mp3-input" placeholder="01 Louvor Exemplo (10).mp3&#10;02 Outro Louvor (12).mp3"></textarea>
        <div style="display:flex;gap:8px;margin-top:4px;">
          <button class="btn-gradient" style="flex:1;" onclick="confirmAddTracks()">Adicionar à Lista</button>
          <button class="icon-action" onclick="closeModal()">Fechar</button>
        </div>
      `;
      document.getElementById('modal-backdrop').classList.add('open');
    }

    function confirmAddTracks() {
      const raw = document.getElementById('bulk-mp3-input').value || '';
      const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(l => l.toLowerCase().endsWith('.mp3'));
      if (lines.length === 0) {
        showToast('Cole ao menos um nome de arquivo terminado em .mp3');
        return;
      }
      const cat = getActiveCategory();
      const byNum = {};
      INITIAL_TRACKS.forEach(it => { if (it.songNumber) byNum[it.songNumber] = it; });

      lines.forEach(fn => {
        let base = fn.replace(/\.mp3$/i, '').trim();
        const m = base.match(/\(\s*(\d+)\s*\)/);
        const num = m ? parseInt(m[1], 10) : null;
        let clean = base.replace(/\s*\(\s*\d+\s*\)/g, ' ').replace(/\s+/g, ' ').trim();
        const title = num ? `${clean} - ${num}` : clean;
        const matched = num ? byNum[num] : null;
        cat.tracks.push({
          title,
          artist: `${cat.label} • ICISP`,
          filename: fn,
          songNumber: num || undefined,
          lyrics: matched ? matched.lyrics : '',
          lines: matched ? matched.lines : []
        });
      });
      saveData();
      closeModal();
      renderPlaylist();
      showToast(`${lines.length} faixa(s) adicionada(s)!`);
    }

    function copyShareLink() {
      const base = (window.location.href || SITE_URL).split('?')[0].split('#')[0] || SITE_URL;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(base).then(() => {
          showToast('Link do player copiado!');
        }).catch(() => {
          window.prompt('Copie o link abaixo:', base);
        });
      } else {
        window.prompt('Copie o link abaixo:', base);
      }
    }

    loadChordsPreference();
    loadSavedData();
    renderBottomNav();
    selectCategory(categories[0].id);
  </script>
