 Deus transformador - 63", "artist": "Google Drive", "url": "https://drive.google.com/file/d/1WlawE1aJf8Hn43K5cIZPdSW5EiZ2gEYb/view"}, {"title": "39 Isaías 40-31 - 64", "artist": "Google Drive", "url": "https://drive.google.com/file/d/1hdcaCCWc2QDNbjdGXHwWIdUyAP_zacbG/view"}, {"title": "40 Confesso meu amor - 112", "artist": "Google Drive", "url": "https://drive.google.com/file/d/1jvwaIUc43MO7CxClIRHLRSs0eXnr5Cjw/view"}, {"title": "41 Quero andar contigo - 108", "artist": "Google Drive", "url": "https://drive.google.com/file/d/1b2w54PkDJX1N-MfPJMKuUekAhSegrPqg/view"}, {"title": "42 Viver teu sonho - 110", "artist": "Google Drive", "url": "https://drive.google.com/file/d/1H-zLR9tkFZm8ZzmqhYtl4QqHN83p17fJ/view"}, {"title": "43 O amor maior que há - 102", "artist": "Google Drive", "url": "https://drive.google.com/file/d/1pA2WjhH3cNFyeQRH8voFDUv_yKhP5t70/view"}, {"title": "44 Vivam em paz - 68", "artist": "Google Drive", "url": "https://drive.google.com/file/d/1p1fq1W7_281lauWGRyR1_pwD4HeQbcBi/view"}, {"title": "45 Poderoso Deus - 127", "artist": "Google Drive", "url": "https://drive.google.com/file/d/15juKSWm2CIS0Hk_4T5Gm9UnScADhsyJD/view"}, {"title": "46 Quem iria imaginar - 82", "artist": "Google Drive", "url": "https://drive.google.com/file/d/1qe7d5PVw1n0FlRt2Lx2em-AJ_xwCzcHW/view"}, {"title": "47 Ó Deus - 79", "artist": "Google Drive", "url": "https://drive.google.com/file/d/1rEglEjMG4Bp0md1WCKKGoh1r6jl-BGJ9/view"}, {"title": "48 Salmo 98 - 90", "artist": "Google Drive", "url": "https://drive.google.com/file/d/19yYWBg0kHlrRX9fJf8vaCwACjgF9RKcL/view"}, {"title": "49 Salmo 117 - 93", "artist": "Google Drive", "url": "https://drive.google.com/file/d/1bUK15GgW9fY7sVXx8ak-BFsDUoEWlL_B/view"}, {"title": "50 Salmo 84 - 87", "artist": "Google Drive", "url": "https://drive.google.com/file/d/1Uxk3VXVgCOozghk5IyvDURlcGN6XvlzL/view"}];

    const audioEl = document.getElementById('audio-el');
    const statusBadge = document.getElementById('status-badge');
    const btnPlay = document.getElementById('btn-play');
    const seekBar = document.getElementById('seek-bar');
    const currentTimeEl = document.getElementById('current-time');
    const durationTimeEl = document.getElementById('duration-time');

    let tracks = [];
    let currentIndex = -1;
    let sourceIndex = 0;

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => { t.style.display = 'none'; }, 3000);
    }

    function extractDriveId(url) {
      if (!url) return null;
      const patterns = [
        /\/file\/d\/([a-zA-Z0-9_-]+)/,
        /[?&]id=([a-zA-Z0-9_-]+)/,
        /\/d\/([a-zA-Z0-9_-]+)/
      ];
      for (const p of patterns) {
        const m = url.match(p);
        if (m && m[1]) return m[1];
      }
      return null;
    }

    function getDirectCandidates(rawUrl) {
      const clean = (rawUrl || '').trim();
      const id = extractDriveId(clean);
      if (!id) return [clean];
      return [
        `https://docs.google.com/uc?export=download&id=${id}`,
        `https://drive.google.com/uc?export=download&id=${id}`,
        `https://drive.google.com/uc?export=open&id=${id}`
      ];
    }

    function formatTime(sec) {
      if (!isFinite(sec) || sec < 0) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function decodeSharedPlaylist(encoded) {
      const base64 = encoded.replace(/-/g, '+').replace(/_/g, '/');
      const padded = base64 + '='.repeat((4 - (base64.length % 4)) % 4);
      const binary = atob(padded);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      const jsonStr = new TextDecoder().decode(bytes);
      return JSON.parse(jsonStr);
    }

    function encodeSharedPlaylist(items) {
      const jsonStr = JSON.stringify(items);
      const bytes = new TextEncoder().encode(jsonStr);
      let binary = '';
      for (let i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function loadState() {
      try {
        const params = new URLSearchParams(window.location.search || '');
        const shared = params.get('p');
        if (shared) {
          const decoded = decodeSharedPlaylist(shared);
          if (Array.isArray(decoded) && decoded.length > 0) {
            tracks = decoded;
            showToast('Playlist compartilhada carregada!');
            return;
          }
        }
      } catch (e) {}
      tracks = DEFAULT_TRACKS.map(item => ({ ...item }));
    }

    function renderPlaylist() {
      const ul = document.getElementById('playlist');
      const query = (document.getElementById('search-box').value || '').trim().toLowerCase();
      document.getElementById('count').textContent = tracks.length;

      const filtered = tracks
        .map((t, idx) => ({ track: t, index: idx }))
        .filter(({ track }) => !query || track.title.toLowerCase().includes(query) || (track.artist || '').toLowerCase().includes(query));

      if (filtered.length === 0) {
        ul.innerHTML = '<li style="color:rgba(255,255,255,0.55);font-size:0.82rem;text-align:center;padding:12px;">Nenhuma música encontrada.</li>';
        return;
      }

      ul.innerHTML = filtered.map(({ track: t, index: i }) => `
        <li class="track-item ${i === currentIndex ? 'active' : ''}" onclick="playTrack(${i}, true)">
          <div class="track-meta">
            <strong>${i === currentIndex ? '▶ ' : ''}${escapeHtml(t.title)}</strong>
            <span>${escapeHtml(t.artist || 'Google Drive')}</span>
          </div>
        </li>
      `).join('');
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function tryNextDirectSource(autoStart) {
      if (currentIndex < 0 || currentIndex >= tracks.length) return;
      const t = tracks[currentIndex];
      const candidates = getDirectCandidates(t.url);
      if (sourceIndex < candidates.length) {
        audioEl.src = candidates[sourceIndex];
        audioEl.load();
        if (autoStart) {
          audioEl.play().catch(() => {});
        }
      } else {
        statusBadge.textContent = 'Bloqueado pelo Drive';
        btnPlay.textContent = '▶';
        showToast('O Google Drive bloqueou o áudio direto desta faixa.');
      }
    }

    function playTrack(idx, autoStart = true) {
      if (idx < 0 || idx >= tracks.length) return;
      currentIndex = idx;
      sourceIndex = 0;
      const t = tracks[idx];
      document.getElementById('track-title').textContent = t.title;
      document.getElementById('track-artist').textContent = t.artist || 'Google Drive';
      statusBadge.textContent = autoStart ? 'Tocando...' : 'Pronto para tocar';
      seekBar.value = 0;
      currentTimeEl.textContent = '0:00';
      durationTimeEl.textContent = '0:00';
      renderPlaylist();
      tryNextDirectSource(autoStart);
    }

    function togglePlay() {
      if (currentIndex < 0 && tracks.length > 0) {
        playTrack(0, true);
        return;
      }
      if (audioEl.paused) {
        if (!audioEl.src) {
          tryNextDirectSource(true);
        } else {
          audioEl.play().catch(() => {
            sourceIndex++;
            tryNextDirectSource(true);
          });
        }
      } else {
        audioEl.pause();
      }
    }

    function seekAudio(val) {
      if (!isFinite(audioEl.duration) || audioEl.duration <= 0) return;
      audioEl.currentTime = (val / 100) * audioEl.duration;
    }

    function nextTrack() {
      if (tracks.length === 0) return;
      playTrack((currentIndex + 1) % tracks.length, true);
    }

    function prevTrack() {
      if (tracks.length === 0) return;
      playTrack((currentIndex - 1 + tracks.length) % tracks.length, true);
    }

    audioEl.addEventListener('play', () => {
      btnPlay.textContent = '⏸';
      statusBadge.textContent = 'Tocando';
    });

    audioEl.addEventListener('pause', () => {
      btnPlay.textContent = '▶';
      if (statusBadge.textContent !== 'Bloqueado pelo Drive') {
        statusBadge.textContent = 'Pausado';
      }
    });

    audioEl.addEventListener('timeupdate', () => {
      if (isFinite(audioEl.duration) && audioEl.duration > 0) {
        seekBar.value = (audioEl.currentTime / audioEl.duration) * 100;
        currentTimeEl.textContent = formatTime(audioEl.currentTime);
        durationTimeEl.textContent = formatTime(audioEl.duration);
      }
    });

    audioEl.addEventListener('loadedmetadata', () => {
      if (isFinite(audioEl.duration) && audioEl.duration > 0) {
        durationTimeEl.textContent = formatTime(audioEl.duration);
      }
    });

    audioEl.addEventListener('ended', () => {
      nextTrack();
    });

    audioEl.addEventListener('error', () => {
      if (currentIndex < 0) return;
      sourceIndex++;
      tryNextDirectSource(true);
    });

    function copyShareLink() {
      if (tracks.length === 0) {
        showToast('Nenhuma música disponível para compartilhar.');
        return;
      }
      const encoded = encodeSharedPlaylist(tracks);
      const base = (window.location.href || SITE_URL).split('?')[0].split('#')[0] || SITE_URL;
      const url = `${base}?p=${encoded}`;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(() => {
          showToast('Link da playlist copiado!');
        }).catch(() => {
          window.prompt('Copie o link abaixo:', url);
        });
      } else {
        window.prompt('Copie o link abaixo:', url);
      }
    }

    loadState();
    renderPlaylist();
    if (tracks.length > 0) {
      playTrack(0, false);
    }
  </script>
</body>
</html>
