<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Player ICISP Play Back</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --purple: #7c3aed;
      --pink: #ec4899;
      --cyan: #06b6d4;
      --bg: #0d0415;
      --surface: #1b0d2b;
      --border: rgba(255, 255, 255, 0.14);
    }
    body {
      background: radial-gradient(circle at top, #1a0530 0%, var(--bg) 72%);
      color: #fff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 14px 48px;
    }
    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    header {
      text-align: center;
      padding: 6px 0;
    }
    header h1 {
      font-size: 1.45rem;
      font-weight: 800;
      background: linear-gradient(90deg, #fff, var(--cyan), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header p {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.65);
      margin-top: 4px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }
    .now-playing {
      text-align: center;
      border-color: rgba(124, 58, 237, 0.55);
      background: linear-gradient(145deg, rgba(124,58,237,0.25), rgba(236,72,153,0.14));
    }
    .badge {
      display: inline-block;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--cyan);
      font-weight: 700;
      margin-bottom: 6px;
    }
    #track-title {
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 3px;
      word-break: break-word;
    }
    #track-artist {
      font-size: 0.84rem;
      color: var(--pink);
      margin-bottom: 14px;
    }
    .progress-wrap {
      margin-bottom: 16px;
    }
    .progress-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.74rem;
      color: rgba(255,255,255,0.72);
      margin-bottom: 6px;
    }
    #seek-bar {
      width: 100%;
      accent-color: var(--pink);
      cursor: pointer;
    }
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }
    .ctrl-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 18px rgba(236, 72, 153, 0.32);
    }
    .ctrl-btn.play-main {
      width: 62px;
      height: 62px;
      font-size: 1.25rem;
    }
    .ctrl-btn:active { transform: scale(0.94); }
    .search-input {
      width: 100%;
      background: rgba(0,0,0,0.42);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.88rem;
      outline: none;
      margin-bottom: 10px;
    }
    .search-input:focus { border-color: var(--cyan); }
    .playlist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.7);
      font-weight: 700;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn-small {
      background: rgba(6, 182, 212, 0.18);
      border: 1px solid rgba(6, 182, 212, 0.45);
      color: var(--cyan);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
    }
    #playlist {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 380px;
      overflow-y: auto;
    }
    .track-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid transparent;
      border-radius: 10px;
      cursor: pointer;
    }
    .track-item.active {
      background: rgba(124, 58, 237, 0.28);
      border-color: var(--purple);
    }
    .track-meta { flex: 1; min-width: 0; }
    .track-meta strong {
      display: block;
      font-size: 0.92rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-meta span {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.62);
    }
    #toast {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: #1f1135;
      border: 1px solid var(--cyan);
      color: #fff;
      padding: 9px 16px;
      border-radius: 99px;
      font-size: 0.8rem;
      display: none;
      z-index: 99;
      max-width: 90vw;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎵 Player ICISP Play Back</h1>
      <p>50 músicas em sequência (pasta: músicas)</p>
    </header>

    <section class="card now-playing">
      <div class="badge" id="status-badge">Pronto para tocar</div>
      <div id="track-title">Selecione uma música na lista</div>
      <div id="track-artist">Player próprio • GitHub</div>

      <div class="progress-wrap">
        <div class="progress-row">
          <span id="current-time">0:00</span>
          <span id="duration-time">0:00</span>
        </div>
        <input type="range" id="seek-bar" min="0" max="100" value="0" step="0.1" oninput="seekAudio(this.value)" />
      </div>

      <div class="controls">
        <button class="ctrl-btn" onclick="prevTrack()" title="Anterior">⏮</button>
        <button class="ctrl-btn play-main" id="btn-play" onclick="togglePlay()" title="Play / Pause">▶</button>
        <button class="ctrl-btn" onclick="nextTrack()" title="Próxima">⏭</button>
      </div>

      <audio id="audio-el" preload="metadata"></audio>
    </section>

    <section class="card">
      <div class="playlist-header">
        <span>Playlist (<span id="count">0</span>)</span>
        <button class="btn-small" onclick="copyShareLink()">🔗 Compartilhar</button>
      </div>
      <input type="search" class="search-input" id="search-box" placeholder="🔍 Buscar música pelo nome ou número..." oninput="renderPlaylist()" />
      <ul id="playlist"></ul>
    </section>
  </div>

  <div id="toast"></div>

  <script>
    const SITE_URL = "https://alancom1-com2.github.io/player_icisp_playback/";
    const AUDIO_FOLDER = "músicas";
    const DEFAULT_TRACKS = [{"title": "01 As Bem Aventuranças Play Back - 138", "artist": "Play Back • ICISP", "filename": "01 As Bem Aventuranças (138) Play Back.mp3"}, {"title": "02 Cristo Vive Play Back - 136", "artist": "Play Back • ICISP", "filename": "02 Cristo Vive (136) Play Back.mp3"}, {"title": "03 É Jesus Play Back - 137", "artist": "Play Back • ICISP", "filename": "03 É Jesus (137) Play Back.mp3"}, {"title": "04 Eis Me Aqui Play Back - 160", "artist": "Play Back • ICISP", "filename": "04 Eis Me Aqui (160) Play Back.mp3"}, {"title": "05 Esculta o Meu Clamor Play Back - 155", "artist": "Play Back • ICISP", "filename": "05 Esculta o Meu Clamor (155) Play Back.mp3"}, {"title": "06 Eu Acredito - 142", "artist": "ICISP", "filename": "06 Eu Acredito (142).mp3"}, {"title": "07 Eu Cantarei o Teu Amor Play Back - 143", "artist": "Play Back • ICISP", "filename": "07 Eu Cantarei o Teu Amor (143) Play Back.mp3"}, {"title": "08 Eu Confio no Senhor Play Back - 144", "artist": "Play Back • ICISP", "filename": "08 Eu Confio no Senhor (144) Play Back.mp3"}, {"title": "09 Filhos de Deus Play Back - 145", "artist": "Play Back • ICISP", "filename": "09 Filhos de Deus (145) Play Back.mp3"}, {"title": "10 Fonte de Alegria Play Back - 140", "artist": "Play Back • ICISP", "filename": "10 Fonte de Alegria (140) Play Back.mp3"}, {"title": "11 Glorioso Deus Play Back - 135", "artist": "Play Back • ICISP", "filename": "11 Glorioso Deus (135) Play Back.mp3"}, {"title": "12 Homens de Fé Play Back - 148", "artist": "Play Back • ICISP", "filename": "12 Homens de Fé (148) Play Back.mp3"}, {"title": "13 Isaías 53 Play Back - 157", "artist": "Play Back • ICISP", "filename": "13 Isaías 53 (157) Play Back.mp3"}, {"title": "14 Louvado Seja Play Back - 149", "artist": "Play Back • ICISP", "filename": "14 Louvado Seja (149) Play Back.mp3"}, {"title": "15 Não Há outro Além de Ti Play Back - 154", "artist": "Play Back • ICISP", "filename": "15 Não Há outro Além de Ti (154) Play Back.mp3"}, {"title": "16 A Nova Jerusalém Play Back - 141", "artist": "Play Back • ICISP", "filename": "16 A Nova Jerusalém (141) Play Back.mp3"}, {"title": "17 O Amor é jesus Play Back - 158", "artist": "Play Back • ICISP", "filename": "17 O Amor é jesus (158) Play Back.mp3"}, {"title": "18 O Criador do Céu e da Terra Play Back - 151", "artist": "Play Back • ICISP", "filename": "18 O Criador do Céu e da Terra (151) Play Back.mp3"}, {"title": "19 O Filho Pródigo Play Back - 152", "artist": "Play Back • ICISP", "filename": "19 O Filho Pródigo (152) Play Back.mp3"}, {"title": "20 Pai Amdo Play Back - 159", "artist": "Play Back • ICISP", "filename": "20 Pai Amdo (159) Play Back.mp3"}, {"title": "21 Perto de Ti Play Back - 139", "artist": "Play Back • ICISP", "filename": "21 Perto de Ti (139) Play Back.mp3"}, {"title": "22 Primeiras Manhãs Play Back - 147", "artist": "Play Back • ICISP", "filename": "22 Primeiras Manhãs (147) Play Back.mp3"}, {"title": "23 O Santo de Israel Play Back - 153", "artist": "Play Back • ICISP", "filename": "23 O Santo de Israel (153) Play Back.mp3"}, {"title": "24 A Supremacia de Cristo Play Back - 146", "artist": "Play Back • ICISP", "filename": "24 A Supremacia de Cristo ( 146) Play Back.mp3"}, {"title": "25 O Único Deus Play Back - 150", "artist": "Play Back • ICISP", "filename": "25 O Único Deus (150) Play Back.mp3"}, {"title": "26 Vamos Cantar Ao Senhor Play Back - 156", "artist": "Play Back • ICISP", "filename": "26 Vamos Cantar Ao Senhor (156) Play Back.mp3"}, {"title": "27 A Palavra - 67", "artist": "ICISP", "filename": "27 A Palavra (67).mp3"}, {"title": "28 Acordar e Cantar - 60", "artist": "ICISP", "filename": "28 Acordar e Cantar (60).mp3"}, {"title": "29 Mostra-me o Caminho - 62", "artist": "ICISP", "filename": "29 Mostra-me o Caminho (62).mp3"}, {"title": "30 Com os olhos fixoe em Jesus - 74", "artist": "ICISP", "filename": "30 Com os olhos fixoe em Jesus (74).mp3"}, {"title": "31 Deus defensor - 65", "artist": "ICISP", "filename": "31 Deus defensor (65).mp3"}, {"title": "32 Homens comuns - 106", "artist": "ICISP", "filename": "32 Homens comuns (106).mp3"}, {"title": "33 Mais que um pai - 129", "artist": "ICISP", "filename": "33 Mais que um pai (129).mp3"}, {"title": "34 Soberano Líder - 71", "artist": "ICISP", "filename": "34 Soberano Líder (71).mp3"}, {"title": "35 Aceitos por Deus - 128", "artist": "ICISP", "filename": "35 Aceitos por Deus (128).mp3"}, {"title": "36 Estou seguro - 57", "artist": "ICISP", "filename": "36 Estou seguro (57).mp3"}, {"title": "37 Encontrando Deus - 131", "artist": "ICISP", "filename": "37 Encontrando Deus (131).mp3"}, {"title": "38 Deus transformador - 63", "artist": "ICISP", "filename": "38 Deus transformador (63).mp3"}, {"title": "39 Isaías 40-31 - 64", "artist": "ICISP", "filename": "39 Isaías 40-31 (64).mp3"}, {"title": "40 Confesso meu amor - 112", "artist": "ICISP", "filename": "40 Confesso meu amor (112).mp3"}, {"title": "41 Quero andar contigo - 108", "artist": "ICISP", "filename": "41 Quero andar contigo (108).mp3"}, {"title": "42 Viver teu sonho - 110", "artist": "ICISP", "filename": "42 Viver teu sonho (110).mp3"}, {"title": "43 O amor maior que há - 102", "artist": "ICISP", "filename": "43 O amor maior que há (102).mp3"}, {"title": "44 Vivam em paz - 68", "artist": "ICISP", "filename": "44 Vivam em paz (68).mp3"}, {"title": "45 Poderoso Deus - 127", "artist": "ICISP", "filename": "45 Poderoso Deus (127).mp3"}, {"title": "46 Quem iria imaginar - 82", "artist": "ICISP", "filename": "46 Quem iria imaginar (82).mp3"}, {"title": "47 Ó Deus - 79", "artist": "ICISP", "filename": "47 Ó Deus (79).mp3"}, {"title": "48 Salmo 98 - 90", "artist": "ICISP", "filename": "48 Salmo 98 (90).mp3"}, {"title": "49 Salmo 117 - 93", "artist": "ICISP", "filename": "49 Salmo 117 (93).mp3"}, {"title": "50 Salmo 84 - 87", "artist": "ICISP", "filename": "50 Salmo 84 (87).mp3"}];

    const audioEl = document.getElementById('audio-el');
    const statusBadge = document.getElementById('status-badge');
    const btnPlay = document.getElementById('btn-play');
    const seekBar = document.getElementById('seek-bar');
    const currentTimeEl = document.getElementById('current-time');
    const durationTimeEl = document.getElementById('duration-time');

    let tracks = [];
    let currentIndex = -1;
    let candidateUrls = [];
    let candidateIdx = 0;

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => { t.style.display = 'none'; }, 3200);
    }

    function buildCandidateUrls(track) {
      if (track.url) return [track.url];
      const enc = encodeURIComponent(track.filename);
      const nfcEnc = encodeURIComponent(track.filename.normalize('NFC'));
      const nfdEnc = encodeURIComponent(track.filename.normalize('NFD'));
      const list = [
        `./${encodeURIComponent(AUDIO_FOLDER)}/${enc}`,
        `./${encodeURIComponent(AUDIO_FOLDER.normalize('NFC'))}/${nfcEnc}`,
        `./${encodeURIComponent(AUDIO_FOLDER.normalize('NFD'))}/${nfdEnc}`,
        `./musicas/${enc}`,
        `./${enc}`
      ];
      return [...new Set(list)];
    }

    function formatTime(sec) {
      if (!isFinite(sec) || sec < 0) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function decodeSharedPlaylist(encoded) {
      const base64 = encoded.replace(/-/g, '+').replace(/_/g, '/');
      const padded = base64 + '='.repeat((4 - (base64.length % 4)) % 4);
      const binary = atob(padded);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      const jsonStr = new TextDecoder().decode(bytes);
      return JSON.parse(jsonStr);
    }

    function encodeSharedPlaylist(items) {
      const jsonStr = JSON.stringify(items);
      const bytes = new TextEncoder().encode(jsonStr);
      let binary = '';
      for (let i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function loadState() {
      try {
        const params = new URLSearchParams(window.location.search || '');
        const shared = params.get('p');
        if (shared) {
          const decoded = decodeSharedPlaylist(shared);
          if (Array.isArray(decoded) && decoded.length > 0) {
            tracks = decoded;
            showToast('Playlist compartilhada carregada!');
            return;
          }
        }
      } catch (e) {}
      tracks = DEFAULT_TRACKS.map(item => ({ ...item }));
    }

    function renderPlaylist() {
      const ul = document.getElementById('playlist');
      const query = (document.getElementById('search-box').value || '').trim().toLowerCase();
      document.getElementById('count').textContent = tracks.length;

      const filtered = tracks
        .map((t, idx) => ({ track: t, index: idx }))
        .filter(({ track }) => !query || track.title.toLowerCase().includes(query) || (track.artist || '').toLowerCase().includes(query));

      if (filtered.length === 0) {
        ul.innerHTML = '<li style="color:rgba(255,255,255,0.55);font-size:0.82rem;text-align:center;padding:12px;">Nenhuma música encontrada.</li>';
        return;
      }

      ul.innerHTML = filtered.map(({ track: t, index: i }) => `
        <li class="track-item ${i === currentIndex ? 'active' : ''}" onclick="playTrack(${i}, true)">
          <div class="track-meta">
            <strong>${i === currentIndex ? '▶ ' : ''}${escapeHtml(t.title)}</strong>
            <span>${escapeHtml(t.artist || 'ICISP')}</span>
          </div>
        </li>
      `).join('');
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function tryCurrentCandidate(autoStart) {
      if (candidateIdx < candidateUrls.length) {
        audioEl.src = candidateUrls[candidateIdx];
        audioEl.load();
        if (autoStart) {
          audioEl.play().catch(() => {});
        }
      } else {
        btnPlay.textContent = '▶';
        statusBadge.textContent = 'Arquivo não encontrado';
        showToast('Verifique se o arquivo está dentro da pasta músicas no GitHub.');
      }
    }

    function playTrack(idx, autoStart = true) {
      if (idx < 0 || idx >= tracks.length) return;
      currentIndex = idx;
      const t = tracks[idx];
      document.getElementById('track-title').textContent = t.title;
      document.getElementById('track-artist').textContent = t.artist || 'ICISP';
      statusBadge.textContent = autoStart ? 'Tocando...' : 'Pronto para tocar';
      seekBar.value = 0;
      currentTimeEl.textContent = '0:00';
      durationTimeEl.textContent = '0:00';
      renderPlaylist();

      candidateUrls = buildCandidateUrls(t);
      candidateIdx = 0;
      tryCurrentCandidate(autoStart);
    }

    function togglePlay() {
      if (currentIndex < 0 && tracks.length > 0) {
        playTrack(0, true);
        return;
      }
      if (audioEl.paused) {
        if (!audioEl.src) {
          tryCurrentCandidate(true);
        } else {
          audioEl.play().catch(() => {});
        }
      } else {
        audioEl.pause();
      }
    }

    function seekAudio(val) {
      if (!isFinite(audioEl.duration) || audioEl.duration <= 0) return;
      audioEl.currentTime = (val / 100) * audioEl.duration;
    }

    function nextTrack() {
      if (tracks.length === 0) return;
      playTrack((currentIndex + 1) % tracks.length, true);
    }

    function prevTrack() {
      if (tracks.length === 0) return;
      playTrack((currentIndex - 1 + tracks.length) % tracks.length, true);
    }

    audioEl.addEventListener('play', () => {
      btnPlay.textContent = '⏸';
      statusBadge.textContent = 'Tocando';
    });

    audioEl.addEventListener('pause', () => {
      btnPlay.textContent = '▶';
      if (statusBadge.textContent !== 'Arquivo não encontrado') {
        statusBadge.textContent = 'Pausado';
      }
    });

    audioEl.addEventListener('timeupdate', () => {
      if (isFinite(audioEl.duration) && audioEl.duration > 0) {
        seekBar.value = (audioEl.currentTime / audioEl.duration) * 100;
        currentTimeEl.textContent = formatTime(audioEl.currentTime);
        durationTimeEl.textContent = formatTime(audioEl.duration);
      }
    });

    audioEl.addEventListener('loadedmetadata', () => {
      if (isFinite(audioEl.duration) && audioEl.duration > 0) {
        durationTimeEl.textContent = formatTime(audioEl.duration);
      }
    });

    audioEl.addEventListener('ended', () => {
      nextTrack();
    });

    audioEl.addEventListener('error', () => {
      if (currentIndex < 0) return;
      candidateIdx++;
      tryCurrentCandidate(!audioEl.paused || statusBadge.textContent === 'Tocando...');
    });

    function copyShareLink() {
      if (tracks.length === 0) return;
      const base = (window.location.href || SITE_URL).split('?')[0].split('#')[0] || SITE_URL;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(base).then(() => {
          showToast('Link do player copiado!');
        }).catch(() => {
          window.prompt('Copie o link abaixo:', base);
        });
      } else {
        window.prompt('Copie o link abaixo:', base);
      }
    }

    loadState();
    renderPlaylist();
    if (tracks.length > 0) {
      playTrack(0, false);
    }
  </script>
</body>
</html>
